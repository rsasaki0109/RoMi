<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">RoMi demo pipeline</title>
  <desc id="desc">RoMi-native or bridged input flows through episode recording, replay, mock policy, and dataset inspection.</desc>
  <rect width="1200" height="560" rx="28" fill="#101418"/>
  <rect x="28" y="28" width="1144" height="504" rx="22" fill="#151B21" stroke="#2C3944" stroke-width="2"/>
  <text x="70" y="88" fill="#F3F7FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="700">RoMi</text>
  <text x="70" y="124" fill="#A7B6C2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20">Replay-first robotics middleware contract for Physical AI workflows</text>
  <text x="70" y="168" fill="#67E8F9" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">native sim / bridge -> record -> replay -> policy -> dataset report</text>

  <g transform="translate(70 225)">
    <rect width="160" height="92" rx="14" fill="#202A32" stroke="#4B6475" stroke-width="2"/>
    <text x="24" y="38" fill="#F3F7FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Source</text>
    <text x="24" y="66" fill="#A7B6C2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">native / ROS2</text>
  </g>

  <g transform="translate(270 225)">
    <rect width="170" height="92" rx="14" fill="#172B35" stroke="#22D3EE" stroke-width="2"/>
    <text x="24" y="38" fill="#F3F7FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Streams</text>
    <text x="24" y="66" fill="#A7B6C2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">RoMi JSONL</text>
  </g>

  <g transform="translate(480 225)">
    <rect width="170" height="92" rx="14" fill="#263023" stroke="#84CC16" stroke-width="2"/>
    <text x="24" y="38" fill="#F3F7FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Record</text>
    <text x="24" y="66" fill="#A7B6C2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">episode.json</text>
  </g>

  <g transform="translate(690 225)">
    <rect width="170" height="92" rx="14" fill="#2D2738" stroke="#A78BFA" stroke-width="2"/>
    <text x="24" y="38" fill="#F3F7FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Replay</text>
    <text x="24" y="66" fill="#A7B6C2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">source_system</text>
  </g>

  <g transform="translate(900 225)">
    <rect width="210" height="92" rx="14" fill="#352826" stroke="#FB923C" stroke-width="2"/>
    <text x="24" y="38" fill="#F3F7FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700">Mock Policy</text>
    <text x="24" y="66" fill="#A7B6C2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">proposed_only</text>
  </g>

  <path d="M235 271H262" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M255 264L264 271L255 278" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M445 271H472" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M465 264L474 271L465 278" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M655 271H682" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M675 264L684 271L675 278" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M865 271H892" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M885 264L894 271L885 278" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(270 376)">
    <rect width="840" height="70" rx="14" fill="#1D252B" stroke="#33424D" stroke-width="2"/>
    <text x="28" y="30" fill="#F3F7FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Dataset report</text>
    <text x="28" y="54" fill="#A7B6C2" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">streams, frames, diagnostics, replay clock, policy actions, observation window</text>
  </g>

  <path d="M1005 322V365" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M998 357L1005 366L1012 357" stroke="#6B7D8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="70" y="488" fill="#7F929E" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Prototype smoke demo: bridge-first, replay-first, inspectable, ROS2-interoperable, non-authoritative policy output.</text>
